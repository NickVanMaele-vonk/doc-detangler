# Step 3.1 raw extraction — LLM-assisted, NOT yet human-reviewed.
# Source: samples/prototype-BC17.md — PROTOTYPE OUTPUT document, flag (P).
# NOT one of the three component blueprints and NOT part of the detangler
# output set; excluded from the C9 placement test (Nick's ruling 2026-07-26,
# same basis as the (A) reference doc). Kept for term discovery, definitional
# evidence, and as a worked example of criterion-3 acronym expansion.
# Line numbers are approximate; verify before citing as provenance.
document: prototype-BC17.md
document_note: >-
  530 lines. A prototype/target-state document, not source material: it is an
  explanatory specification of one Behaviour Category assembled FROM the three
  blueprints (its own Sources note at L11 cites blueprint-UCE.md v30,
  blueprint-SBSP.md, blueprint-MCL.md §12.2, plus a reference implementation
  and MTSAM_Scoring_Objects.md). Three properties make it valuable for Phase 3
  despite the (P) exclusion. (1) It carries an explicit master glossary at §0.1
  expanding 71 abbreviations, and states as a design goal that "Every
  abbreviation is spelled out --- in prose, in the glossary (§0.1), and inside
  the tables themselves" (L9) — a direct precedent for rubric criterion 3.
  (2) It supplies expansions and one-line roles for many acronyms the three
  blueprints use but never expand (RT02, RT05, BTI, QCR, QLS, NCS, ORS, OSS,
  PDRP, PSP, TCE, TCS, TPS, AOB, HHI). (3) It resolves several
  set-level orphans with usable definitions. Three cautions, all recorded per
  term below. (a) §0.1 is ordered ALPHABETICALLY, not topologically, so it
  violates criterion 1 within itself — the ADA row (L19) cites ECIL before
  ECIL's own row (L35), the HQLD row (L39) cites gap MTSAM-L08 before its row
  (L52), and the AOB row (L20) cites the Aggressor Dominance signal defined
  only at §3.1. It is a lookup table, not a readable glossary. (b) It
  introduces expansions that CONFLICT with the three blueprints — most
  seriously MTSAM as "MTS Analytical Market surveillance" (L51) against the
  merged list's "MTS Associated Markets", and MCL as "Market Configuration
  Layer" (L11), a fourth naming variant. (c) It contains proposed calibrations
  and corrections of its own ("Correction basis (was undefined T-095)",
  Appendix C gap register, Appendix D code-vs-methodology discrepancies) which
  are this document's inventions, not blueprint content — they must never be
  back-propagated into a glossary definition as though sourced.
