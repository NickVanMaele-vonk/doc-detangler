notes: >-
  Cycle disposition (Nick, 2026-07-29, ISO 704 §6.5.2): the source clause
  "IS=0 collapses IntentFactor and PriorityScore, and EscalationReadiness
  cannot be TRUE" is a consequence statement, not the definition proper;
  it is preserved here verbatim and excluded from the definition, removing
  the circular edge to [[escalationreadiness]] (whose gate genuinely
  depends on IS≥2 and keeps its edge here) and the edge to
  [[priorityscore]]. See also [[intentfactor]].
  The expansion "Intent Score" appears nowhere in the shortened corpus — the
  shortened UCE writes "Intent assessment (IS)" — and is carried from the
  candidate list. Surface form "IS" is dangerously ambiguous (also the
  English verb "is"), hence Nick's abbreviation caveat. Distinct from IScore,
  which is a separate construct (see [[iscore]]). M usage: "MANDATORY_ASSESS
  override where dominant pre-ECB positioning AND IS ≥ 2".
