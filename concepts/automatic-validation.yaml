notes: >-
  Single-document term (§3 bulk). Orphan: never defined here — the
  governing 'seven auto-validation conditions' live in '§VI-A.5.3 UCE
  v30', a section absent from the shortened U (absence from the
  shortened blueprints is not evidence of absence from the full set,
  §7b caution), so the term stays S-only under the C9 count. One of the
  five [[bvr]] closure modes. This document contributes two conditions:
  Condition 3 — 'The ECIL amplification value (ibe.ecil_amplification)
  participates directly in Automatic Validation as Condition 3'
  ([[ecil-amplification]], threshold 0.20) — and Condition 5 —
  'Explanation types listed as ‘safe’ are accepted as automatic
  validation basis (Condition 5 of the seven auto-validation
  conditions, §VI-A.5.3 UCE v30)' ([[explanation-type]]). Surface
  variants in the corpus: 'Automatic Validation', 'auto-validation
  conditions', 'automatic validation basis', and the §A.4.3.1 heading's
  'BVR Auto-Validation Threshold'.
