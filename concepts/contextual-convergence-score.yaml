notes: >-
  Single-document term (§3 bulk). Orphan: letter-expanded only in the ECIL
  Supplemental Specification contents row — 'CCS (Contextual Convergence
  Score)' — and owned by that companion document, but already wired into
  the ELS formula here. Step 19 verbatim: 'CCS_penalty: where CCS ≥ HIGH
  and all active ECIL events are CONTRADICTS_PATTERN or FULLY_EXPLAINED,
  CCS_penalty = −0.05 applied before normalisation (active deduction, not
  just weight reduction).' CCS_penalty is a derived deduction, not an
  alias. Distinct from CQS ([[convergence-quality-score]]) and from
  [[crs]]. See [[external-context-intelligence-layer]],
  [[escalation-likelihood-score]], [[contradicts-pattern]].
