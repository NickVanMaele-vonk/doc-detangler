id: classification
term: classification
aliases: [classification band]
status: candidate
superseded_by: null
placement: glossary
used_in: [U, S, M]
definition: >-
  The analytical pipeline's primary output: a band on the five-level scale
  NONE / LOW / MEDIUM / HIGH / VERY HIGH; scoring orders signals within a
  band and does not influence classification.
source:
