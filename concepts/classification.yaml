    verified_against:
      git_blob: 4cae72dece7638c1ddec8206a3c6a24610196de0
      stated_version: "Version 29 | June 2026"
  - doc: samples/blueprint-MCL-shortened.md
    section: "Front matter"
    para_hash: sha256:441cb3dd18ed78eb36fff7904b48d5e62a0eded962e4bfe006b1574a06fdb1f1
    verified_against:
      git_blob: 71b9d9520ea205c72208fcc5d090b744f1e3e43b
      stated_version: "v21"
depends_on:
  - 22-step-analytical-pipeline
  - signal
flags: [A, conflict]
conflict:
  summary: >-
    Four-level scale (U) vs five-level scale with NONE (M, and A) — surfaced,
    not reconciled (C8 / criterion 6). Nick's ruling: five-level scale is
    leading. (P) is a third witness on the four-level side (candidate list
    §7c, conflict P-8): its Final Concern bands run LOW / MEDIUM / HIGH /
    VERY HIGH with no NONE. Nick's ruling 2026-07-30: keep, flag to humans
    for disambiguation.
  spans:
    - doc: samples/blueprint-UCE-shortened.md
      section: "II.1 Pipeline Overview"
      quote: >-
        12 Classification PRIMARY OUTPUT LOW/MEDIUM/HIGH/VERY HIGH determined
        by structural gates. PriorityScore does not influence classification.
      para_hash: sha256:08afa188d619b207ca15f42e5bd3cb49f3c27a95d1c4cbe3bfa8aecad721d184
    - doc: samples/blueprint-MCL-shortened.md
      section: "Front matter"
      quote: >-
        Includes the updated five-level BehaviouralConcern axis (NONE / LOW /
        MEDIUM / HIGH / VERY HIGH)
      para_hash: sha256:441cb3dd18ed78eb36fff7904b48d5e62a0eded962e4bfe006b1574a06fdb1f1
    - doc: samples/prototype-BC17.md
      section: "Appendix F — Chronological calculation sequence (raw data → classification)"
      quote: >-
        21 4 Final Concern Base Concern + Amplifiers − Suppressors (ECIL
        context_effect, BCI level, HSL, PIR, RSA) LOW / MEDIUM / HIGH /
        VERY HIGH
      para_hash: sha256:d6d0675a15bdf2fa1f54c12d1436c97d77aa495d91084a8ef1691c88e30d2f8d
review: >-
  Decision: keep - use five-level scale as leading (Nick,
  candidate-terms-merged.md §1b)
notes: >-
  The definition follows the five-level scale per Nick's ruling; the UCE
  Step 12 span enumerates four levels (no NONE). The M span sits in the "What
  is new in v22" block of a document titled v21 — that version skew is data,
  not a bug (criterion 6). M frames the five-level scale as the
  "BehaviouralConcern axis": possible concept overlap between classification
  and BehaviouralConcern, left for disposition rather than aliased. Both
  conflict quotes are pandoc-plain normalised renderings of grid-table cells;
  wording, casing, and level names are verbatim (criterion 5). Cycle
  disposition (Nick, 2026-07-30): classification is a status recommended
  by a tool and [[gate]] is a decision moment about it — classification
  precedes gate. The clause "determined by the highest structural gate
  cleared" moved here verbatim from the definition proper and the edge to
  [[gate]] dropped (ISO 704 §6.5.2); gate's definition keeps the reverse
  dependency.
