id: gate
term: gate
aliases: [structural gate, gate architecture]
status: candidate
superseded_by: null
placement: glossary
used_in: [U, M]
definition: >-
  A step condition in the non-compensatory architecture: no dimension in a
  later step can compensate for a failed gate in an earlier step, and
  classification is determined by the highest structural gate cleared.
