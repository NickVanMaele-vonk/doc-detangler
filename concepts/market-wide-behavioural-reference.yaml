id: market-wide-behavioural-reference
term: Market-Wide Behavioural Reference
aliases: [MWBR]
status: candidate
superseded_by: null
placement: glossary
used_in: [U, M]
definition: >-
  The reference that normalises quote-domain signals against peer behaviour
  before classification: MWBR_NORMAL reduces the quote-domain CQS uplift by
  30% (not eliminated), MWBR_ANOMALOUS applies it at full rate.
