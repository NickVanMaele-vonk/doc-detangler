notes: >-
  M never expands MWBR (candidate-list note). The expansion appears in U I.2
  principle (e): "Market-Wide Behavioural Reference (MWBR) normalises quote
  signals against peer behaviour before classifying". Level bands in the U
  step row: ELEVATED (1σ–2σ), NORMAL (<1σ), BELOW_NORMAL (<0). M's v22 block
  cites a "corrected MWBR downward adjustment scoping rule" (MWBR_ANOMALOUS
  scoped to non-LOW classifications only — Section 11.5 v5 fix).
