notes: >-
  Set-level orphan: used in S and M but defined only in (A) — the definition
  above is sourced from (A) §0 Definitions, which is informational and never
  counts toward C9 placement. "MTS" alone is used loosely in the sources for
  the platform, the operator, and the surveillance export; high confusion
  risk with MTS Associated Markets (MTSAM). Nick's review note (not source):
  legal entity in Italy, "Mercato dei Titoli di Stato", sister company of
  MTSAM. Conflict P-2 (candidate list §7c) is closed, not open: (P) §0.1
  supplies the expansion but assigns it the venue sense — "MTS Mercato dei
  Titoli di Stato the electronic trading venue" — and (P) §0.2 repeats it
  ("one row of the MTS (Mercato dei Titoli di Stato) Trades feed"). Nick
  ruled 2026-07-30 that MTS is a legal entity and the venue reading is a
  confusion introduced by (P). The expansion is kept; the venue sense is
  not, and no conflict is raised. The (A) §0 span was re-anchored
  2026-07-30: the recorded hash predated the block-hash convention and no
  longer resolved; the block carrying the definition sentence is the "0.
  Definitions" heading block, and the definition wording is unchanged.
