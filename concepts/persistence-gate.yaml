id: persistence-gate
term: Persistence Gate
aliases: [PG, Step 11b]
status: candidate
superseded_by: null
placement: UCE
used_in: [U]
definition: >-
  Persistence Gate (PG) requires behavioural repetition before HIGH absent
  explicit structures. At Step 11b, for signals reaching CQT2 that have
  not been blocked by DIF: where no BPL component is confirmed
  (bpl_drift_flag=FALSE AND session_consistency_confirmed=FALSE AND
  multi_day_conditioning_detected=FALSE AND cwps_intra < 0.50 AND
  escalating_dominance_trend=FALSE) AND no participant interaction is
  active (IDS=0, ISS=0): classification capped at MEDIUM-INVESTIGATE.
