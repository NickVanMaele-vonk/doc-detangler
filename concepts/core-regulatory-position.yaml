id: core-regulatory-position
term: Core Regulatory Position
aliases: []
status: candidate
superseded_by: null
placement: MCL
used_in: [M]
definition: >-
  The Core Regulatory Position: MTSAM considers the currently implemented
  RT/RD trade-based surveillance scenarios to provide a sufficient
  foundational detection framework for core trade-based market abuse
  risks, provided that this framework is complemented by enhanced
  behavioural analysis, block trade behavioural intelligence, and
  additional quote-driven surveillance capabilities reflecting the
  specific characteristics of anonymous quote-driven sovereign bond
  interdealer markets.
