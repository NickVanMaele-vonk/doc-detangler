notes: >-
  Single-document term (§3 bulk). The definition is the block's full
  statement, reproduced with its modality intact — 'sufficient
  foundational detection framework' held together with 'provided that this
  framework is complemented' (criterion 5: the proviso carries the
  position's force). The position is elaborated by the five pillars and
  governed by §0.3, where describing the RT/RD framework as a 'sufficient
  standalone framework' is a prohibited formulation. See
  [[five-pillar-fsma-argument]], [[language-governance]],
