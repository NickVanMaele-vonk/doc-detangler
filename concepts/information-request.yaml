notes: >-
  Single-document term (§3 bulk). Orphan: a generic supervisory phrase
  given a specific role but never defined — the designated supervisory
  action produced by Level 3 / CICI hypothesis findings. A.4.1 Level 3
  row ([[four-level-observability-framework]]): 'The hypothesis is
  useful for framing an information request even without confirmatory
  data', with ISGO language recommending 'An information request
  regarding the participant’s positions at other venues during the
  relevant period is recommended'; the A.4.1 operational-priority
  paragraph adds that Level 3 hypotheses 'provide investigative context
  and support information requests'. The CICI epistemological position
  ([[cross-instrument-context-intelligence]]) states that the finding
  'justifies an information request to the participant about their
  derivatives positions' and continues — across a span of C1
  control-byte mojibake that YAML scalars cannot carry, so the quote
  stops around the damage (batch-2 precedent) — 'which is a supervisory
  action that can be taken on the basis of the CICI finding alone'. The CMCS ISGO mandatory
  language ([[cross-market-convergence-score]], [[isgo]]) closes with
  'An information request regarding the participant’s derivatives and
  futures positions during the relevant period is recommended'. The
  extraction alias 'information request regarding the participant's
  positions' is a usage phrase, not adopted (C9 hygiene).
