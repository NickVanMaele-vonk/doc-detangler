definition: >-
  Universal doctrine applying to every deployment regardless of
  institution or market: throughput governance, degraded-mode doctrine,
  resiliency and operational failure escalation, queue prioritisation.
  These principles cannot be varied by Calibration Layers — only
  operationalised.
