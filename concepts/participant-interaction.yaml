notes: >-
  Single-document term (§3 bulk). Step 6 dimension 'Participant
  interaction (IDS, ISS, IQ)', SCORED OUTPUT + GATE; the extraction's
  fuller surface 'Participant interaction assessment' does not occur in
  the corpus. IDS, ISS and IQ are never letter-expanded. DIF domain C is
  '(C) Interaction --- IDS/ISS/IQ participant interaction'; the
  [[persistence-gate]] trigger includes 'no participant interaction is
  active (IDS=0, ISS=0)'. ISS is distinct from IS ([[intent-score]]) and
  from [[iscore]] — extraction hazard, candidate-terms-merged.md §4 item
  32. See [[domain-independence-filter]], [[dif-analytical-domains]].
