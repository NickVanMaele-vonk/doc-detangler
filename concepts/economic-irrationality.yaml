notes: >-
  Single-document term (§3 bulk). Orphan: used as a Level 3 hypothesis
  component but never defined — 'The model identifies the pattern,
  timing, influence capability, and economic irrationality. It cannot
  prove the external profit.' and 'pattern + timing + influence
  capability + economic irrationality (AOB) together support the
  hypothesis.' (first span, Level 3 grid row). Repo-financing ISGO
  language (second span): 'repo financing is a possible explanation for
  the economic irrationality', where the AOB pathway applies — 'OLO
  activity is systematically unprofitable in isolation' with 'OS=0
  while conditioning confirmed' (the dash between the two clauses is
  mojibake-damaged in the source — C1 control bytes not reproducible in
  this record, surfaced instead). Near-synonym drift among 'economic
  irrationality', 'AOB', and 'cost accepted' ([[sb-02]] row) —
  surfaced, not harmonised (criterion 6); AOB has no record yet (see
  [[sb-02]] notes). See [[sb-25]], [[repo-market-linkage]],
  [[outcome-score]].
