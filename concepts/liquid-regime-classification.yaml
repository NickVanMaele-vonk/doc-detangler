notes: >-
  Single-document term (§3 bulk). The A.2 grid table is OCR-split
  across four blocks — one per regime row — so all four row blocks are
  anchored; the definition assembles the four 'Definition for Sovereign
  Bond Context' cells. Regime names NORMAL/THIN/ILLIQUID/STRESSED are
  values enumerated in the definition, not aliases (C9 hygiene).
  Per-regime EMT Threshold Adjustments: NORMAL — 'Standard calibrated
  thresholds apply.'; THIN — 'Dominance threshold reduced 20%; price
  deviation threshold increased 30%. Volume indicator reliability
  downgraded to MEDIUM.'; ILLIQUID — 'Dominance threshold reduced 40%;
  price deviation threshold increased 50%; spread widening threshold
  doubled.'; STRESSED — 'All EMT thresholds elevated 30%.
  ModelConfidence capped at MEDIUM. PFNE monitoring suspended for
  stressed session.' See [[emt-threshold]], [[modelconfidence]],
  [[pfne]].
