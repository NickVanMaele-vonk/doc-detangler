id: liquid-regime-classification
term: Liquid Regime Classification
aliases: []
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  Four-regime classification of sovereign bond market conditions, each
  regime defined for the sovereign bond context with an EMT Threshold
  Adjustment: NORMAL — bid-ask spread within 1.5× historical median;
  order book depth within 20% of 30-day baseline; no circuit breaker or
  suspension events; THIN — spread 1.5×–3× historical median; depth
  50%–80% of baseline; or seasonal low-liquidity period; ILLIQUID —
  spread >3× historical median; depth <50% of baseline; or
  post-suspension reopening within first 30 minutes; STRESSED —
  sovereign spread widening >50bps in session; confirmed macro event
  driving market-wide directional moves.
