definition: >-
  The propagation of a manipulated price into downstream consequences —
  repo market margins, ECB collateral haircuts, covered bond pool
  valuations, NAV — assessed mandatorily for RD03, RD04, RD07, RD12
  signals; confirmed downstream exposure makes OS=2 automatic.
