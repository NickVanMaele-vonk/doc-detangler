notes: >-
  Single-document term (§3 bulk). Orphan: named in the v24 row ('§VII.4
  PIR') and constrained by the v25 §XI amendment — 'Participant History
  (PIR) cannot sole-drive a MEDIUM or HIGH preliminary RSA assessment.' —
  but what the factor comprises is not stated; §VII.4 is not included in
  the shortened corpus. The II.1 intro lists 'participant history' among
  the raw data streams the IBEB groups into IBEs. The acronym PIR does not
  match the letters of 'Participant History'; no document expands PIR. See
  [[pir-amplifier-only-rule]], [[assessment-basis]],
  [[reasonable-suspicion-assessment]],
  [[intraday-behavioural-event-builder]].
