id: identity-driven-coordination
term: identity-driven coordination
aliases: []
status: candidate
superseded_by: null
placement: glossary
used_in: [S, M]
definition: >-
  Quote behaviour in which participant B deliberately tracks participant
  A's specific order activity — using order IDs, sizes, timing patterns, or
  pre-arranged signals — and responds to A's specific orders rather than to
  the anonymous market condition, producing an observable pattern identical
  to liquidity-driven reaction.
