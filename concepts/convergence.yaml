notes: >-
  Generic word with load-bearing local meaning. Definition assembled from
  U Principle 3 and M Pillar 2 ("convergence must be independently
  confirmed across multiple analytical dimensions. No single alert can
  independently drive escalation"). The negative case "false convergence"
  (U Principle 4) is deliberately not an alias — it is the failure mode,
  policed by the dependency filter (see [[dependency-score]], [[daf]]). S
  usage: cross-venue divergence contributes to "the convergence score"
  (A.4.2).
