id: convergence
term: convergence
aliases: [convergence validation, coherent alignment]
status: candidate
superseded_by: null
placement: glossary
used_in: [U, S, M]
definition: >-
  Coherent alignment across multiple independent analytical dimensions,
  required for HIGH and VERY HIGH classification; convergence must be
  independently confirmed across multiple analytical dimensions.
