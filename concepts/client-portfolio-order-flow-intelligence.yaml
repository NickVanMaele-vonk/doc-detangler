notes: >-
  Row 4 of the four removed-category entries in [[removal-register]]; the
  definition is the row's "Description" cell verbatim. MTSAM Limitation
  cell: "MTSAM-L11: RFQ order flow absent." — see [[mtsam-l11]]. Removal
  Rationale and Residual Treatment cell, verbatim: "Removed. MTSAM has no
  access to dealer client books or pending RFQ flows. The SB-30 misuse of
  confidential order information archetype uses a market footprint
  detection approach based solely on MTS trade timing." This row is the
  scoping site for [[sb-30]], which already anchors its M definition on
  this block. Sense-collision edge, kept as textual truth and flagged: the
  definition's "MTS anonymous order book" matches the [[mts-spa]] alias
  "MTS", but the anonymous book is MTSAM's venue — see
  [[mts-associated-markets]] and Nick's P-2 ruling 2026-07-30.
