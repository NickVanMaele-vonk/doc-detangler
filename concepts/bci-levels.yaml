notes: >-
  Single-document term (§3 bulk). The bare level names (Follower,
  Contributor, Amplifier, Leader, Primary Driver) are not carried as
  aliases, matching the [[mwbr-score-levels]] precedent.
  BCI_PRIMARY_DRIVER is the bci_concern_driver_code value at BCI ≥ 10 and
  occurs nowhere else, so it stays an alias here. Signal-sense collision:
  Amplifier the BCI level vs the Amplifier/Suppressor Assessment
  ([[amplifier-suppressor-assessment]]). The scale belongs to
  [[behavioural-causality-indicator]].
