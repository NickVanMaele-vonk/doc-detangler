id: three-position-data-types
term: Three-Position Data Types
aliases: []
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  The three participant-level position data types the CICI framework
  addresses: Participant OTC Positions (bilateral bond trades, repo
  books, net OLO exposure), Participant Futures Positions (Bund
  futures, OAT futures, derivative overlay), and Participant Repo
  Positions (overnight and term repo, securities financing) — each
  FORMALLY REMOVED from operational model.
