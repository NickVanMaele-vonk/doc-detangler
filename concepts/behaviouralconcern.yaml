notes: >-
  Set-level orphan (definition: null — not invented, C2): one of the three
  outputs of the BehaviouralConcern / EvidenceConfidence /
  EscalationReadiness three-output model, formalised in M's v22 block
  (Section 11, with a five-level axis) and used in U's Follower Rule ("BCI
  < 3 → BehaviouralConcern capped at MEDIUM (hard cap, not overridable)")
  — but never itself defined in the shortened corpus. Extraction
  observation, surfaced: the HIGH / VERY HIGH classification levels used
  throughout M 0.1 and 1.2 appear to be values of this axis, though never
  stated explicitly. See [[escalationreadiness]].
