id: priorityscore
term: PriorityScore
aliases: []
status: candidate
superseded_by: null
placement: glossary
used_in: [U, M]
definition: >-
  The pipeline's secondary, ranking-only output, computed as PriorityScore =
  IScore × CF × IntentFactor × DependencyFactor; non-compensatory and bounded
  by gate strength, it orders signals but does not influence classification.
