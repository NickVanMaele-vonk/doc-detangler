notes: >-
  Single-document term (§3 bulk). Definition assembled (C2) from the five
  Checkpoint row labels of the II.2 table, which defines each checkpoint
  by Trigger, Required Human Action, SLA and Audit Record columns. SLAs
  verbatim: 'HIGH: 5 bd / VERY HIGH: 24 hrs' (HCP-1, HCP-2); 'VERY HIGH: 5
  bd from notificatio n' (HCP-3, OCR-split); 'Immediate upon CCO approval'
  (HCP-4); 'No SLA — governanc e action.' (HCP-5, OCR-split). The acronym
  HCP is never letter-expanded outside the row labels. See
  [[human-review-required]], [[fp-code]], [[cco]], [[methodology-lead]],
  [[derisking-assessment]].
