notes: >-
  Definition assembled from M Pillar 3 ("the momentum signal may be
  CONTRADICTS_PATTERN (event provides a full alternative explanation)").
  One of the three ECIL outcome codes listed in S A.4.1:
  AMPLIFIES_SUSPICION / CONTRADICTS_PATTERN / SUPPORTS_EXPLANATION. U Step
  19 uses it in the CCS_penalty rule alongside FULLY_EXPLAINED — a fourth
  code surfaced nowhere else; surfaced, not reconciled. See
  [[external-context-intelligence-layer]], [[supports-explanation]].
