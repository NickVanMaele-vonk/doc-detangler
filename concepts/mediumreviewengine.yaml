id: mediumreviewengine
term: MediumReviewEngine
aliases: []
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  Groups MEDIUM signals by explanation_type, which is derived from BOA
  label and suppressor codes (D.4.1), and reads IBE.metadata['event_context']
  as the event_context_map input (D.4.2); fields in {braces} of the
  mandatory BVR validation basis templates are populated by
  MediumReviewEngine or MediumReviewGroup fields at closure time and
  written to the OAIC audit trail.
