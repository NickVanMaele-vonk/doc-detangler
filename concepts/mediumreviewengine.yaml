notes: >-
  Cycle disposition (Nick, 2026-07-30): software component — not defined;
  outgoing edges dropped (edges live only on defined records, D10 §4).
  Not flagged orphan: the source does define it; the corpus wording is
  preserved here verbatim: "Groups MEDIUM signals by explanation_type,
  which is derived from BOA label and suppressor codes (D.4.1), and reads
  IBE.metadata['event_context'] as the event_context_map input (D.4.2);
  fields in {braces} of the mandatory BVR validation basis templates are
  populated by MediumReviewEngine or MediumReviewGroup fields at closure
  time and written to the OAIC audit trail." Single-document term (§3
  bulk). Software component named by the embedded §D.4 amendment text
  inside the A.6 archetype table (first hash covers the whole table
  block); the preserved wording is assembled from the D.4.1 and D.4.2
  sentences plus the §A.6.1 templates sentence.
  MediumReviewGroup appears only alongside it ('populated by
  MediumReviewEngine or MediumReviewGroup fields at closure time and
  written to the OAIC audit trail') — whether it is a separate
  component or this engine's grouping record is not stated (surfaced,
  not judged; no shared alias). The explanation_type mapping 'is
  authoritative for BVR grouping and is implemented in
  medium_review._derive_explanation_type()' (implementation function
  name-check, not an alias). See [[explanation-type]],
  [[event-context]], [[behavioural-objective-assessment]],
  [[oaic-audit-trail]], [[bvr]].
