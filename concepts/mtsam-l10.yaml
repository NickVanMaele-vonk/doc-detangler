notes: >-
  Entry of [[mtsam-l-data-limitation-register]]. The definition follows
  the sense shared by M 1.0.1 and S position type 2 (Bund futures, OAT
  futures, derivative overlay — no Eurex position data, no EMIR-reported
  derivatives positions, no FCM records); the conflicting repo-
  intelligence assignment is in the conflict block. Consequence recorded
  in both docs: the SB-26 cash bond / futures interaction archetype is
  retained as a Tier 3 investigative hypothesis only — see [[sb-26]].
