  re-placement ruling that had put it in the glossary — Nick ruled
  2026-07-30, on the placement findings of the first `detangle validate`
  run, that the standard rule governs on the corpus we have. Expected to
  be revisited against the full documents, where a second component
  blueprint may well use it. (P) §0.1 names it 'RT02 Excessive activity' — that §7b row was
  promoted to §1e (Nick, 2026-07-28), but (P) is informational only and
  its expansion is not promoted into the definition (C2).
