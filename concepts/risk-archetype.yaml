    §VI.1a claims a 45-archetype taxonomy — surfaced, not reconciled (C8 /
    criterion 6). S's table is additionally truncated: rows SB-21..SB-35
    are missing from the shortened source. Identifier-scheme conflict
    (candidate list §7c, conflict P-4): (P) numbers its archetypes RA-##
    (RA-28, RA-29), a third scheme alongside SB-## and the two counts —
    separate taxonomy or renumbering is unstated, and RA-29
    "Front-Running Indicator" may overlap [[sb-30]] (§4 conflict #8).
    Nick's ruling 2026-07-30: keep, flag to humans for disambiguation.
