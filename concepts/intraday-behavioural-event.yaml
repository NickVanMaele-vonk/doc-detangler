id: intraday-behavioural-event
term: Intraday Behavioural Event
aliases: [IBE]
status: candidate
superseded_by: null
placement: glossary
used_in: [U, S]
definition: >-
  A grouping of raw data streams — trades, quotes, alerts, ECIL context, and
  participant history — built by the Intraday Behavioural Event Builder for
  one participant-instrument pair within a configurable temporal window; each
  IBE is the primary input to Stage 1 of the analytical pipeline.
