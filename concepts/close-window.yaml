notes: >-
  The candidate list marks the defining content "M (parameterisation)": the
  only definitional content is the MTSAM parameter value, reproduced with
  its exact number and timezone (criterion 5). S treats CLOSE_WINDOW as a
  framework ("15-code end-of-day RD alert taxonomy with CLOSE_WINDOW
  framework") and uses it in archetype detections and BT-07 sub-types.
  Narrowed to an orphan 2026-07-31 (Nick). The corpus never states what a
  close window is: searched across all three blueprints, "assessment
  window", "preceding the close" and "end-of-day assessment" do not occur,
  and every other occurrence of CLOSE_WINDOW uses it as a code or a
  framework without explaining it. The only definitional-looking content
  was MTSAM's parameter value, which is that venue's choice rather than
  what the term means — so it moves to its own record,
  [[close-window-start-minutes]], and the alias goes with it (a parameter
  name is not a synonym for a business term; MWBR_ANOMALOUS precedent).
  What remains is a term used across S and M and defined nowhere, which is
  exactly what the orphan flag records. Nick supplies the general sense
  after tool deployment, into the documents themselves rather than as an
  authored record field. The edge to [[mts-associated-markets]] is dropped
  with the parameter clause: the concept is generic and does not depend on
  the venue.
