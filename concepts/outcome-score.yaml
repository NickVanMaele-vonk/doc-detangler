id: outcome-score
term: Outcome Score
aliases: [OS, Outcome Severity]
status: candidate
superseded_by: null
placement: glossary
used_in: [U, S]
definition: >-
  The outcome-materiality gate score, OS (0–2/U) = max(Price, Liquidity,
  Information Impact); OS=0 zeroes PriorityScore and imposes a MEDIUM
  classification ceiling.
source:
