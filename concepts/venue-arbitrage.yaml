notes: >-
  Single-document term (§3 bulk); one of the four named
  [[cross-venue-manipulation]] patterns (grid-table row; the hash covers
  the pattern table block). Detection logic: cross-venue spread |MTS_mid -
  OTC_execution_price| materially exceeding the historical cross-venue
  spread distribution; 'Where MTS mid was influenced by participant's own
  electronic quoting (RT04 candidate), the OTC execution at MTS-influenced
  prices is the exploitation leg.'
