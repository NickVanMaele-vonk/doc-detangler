id: venue-arbitrage
term: Venue Arbitrage
aliases: []
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  Cross-venue manipulation pattern in which the participant identifies a
  price discrepancy between the electronic MTS market and bilateral OTC
  pricing — a discrepancy that the participant may have manufactured
  through electronic quote conditioning — and exploits the spread,
  executing bilaterally at the favourable side of the manufactured
  discrepancy.
