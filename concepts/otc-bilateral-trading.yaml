id: otc-bilateral-trading
term: OTC bilateral trading
aliases: [OTC bilateral component]
status: candidate
superseded_by: null
placement: glossary
used_in: [S, M]
definition: >-
  Bilateral off-book trading in Belgian OLOs, in scope as T+1 trade reports
  (direction and size) with EOD-only timestamps (MTSAM-L01); trades outside
  17:00 CET are not subject to the RT pass but are assessed in a
  post-session OTC review pass.
