id: liquidity-migration
term: Liquidity Migration
aliases: []
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  Cross-venue manipulation pattern in which the participant reduces
  electronic quoting presence (quote withdrawal, widening spreads, depth
  removal from MTS order book) and increases bilateral OTC execution
  volume in the same instrument during the same session; OTC execution
  benefits from prices that the electronic venue withdrawal has
  influenced.
