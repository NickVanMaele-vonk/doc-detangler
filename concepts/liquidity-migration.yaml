notes: >-
  Single-document term (§3 bulk); one of the four named
  [[cross-venue-manipulation]] patterns (grid-table row; the hash covers
  the pattern table block). Definition assembled from the row's
  MTS-observable, OTC-observable and detection-logic cells. The row notes
  the electronic leg 'appears as normal quote management or potential RT08
  pre-stress signal', and detection requires OTC trade data with intraday
  timestamps ('MTSAM-L01 remediation required for full detection').
