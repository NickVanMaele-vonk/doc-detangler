definition: >-
  Stage 0 (pre-pipeline): the Intraday Behavioural Event Builder (IBEB,
  §XVII.10) groups raw data streams — trades, quotes, alerts, ECIL
  context, and participant history — into Intraday Behavioural Events
  (IBEs) for each participant-instrument pair within a configurable
  temporal window. Each IBE is the primary input to Stage 1.
