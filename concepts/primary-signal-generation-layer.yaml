notes: >-
  Single-document term (§3 bulk). The FSMA framing block instructs that
  the existing RT/RD framework 'should be presented as the primary signal
  generation layer — the detection foundation on which behavioural
  adjudication, contextual enrichment, and quote intelligence are built.'
  The aliases are the co-approved formulations for describing that
  framework in the §0.3 governance table ('Foundational detection layer;
  primary signal generation framework; core trade-based surveillance
  baseline'); the prohibited counter-formulations ('Complete coverage;
  full MAR coverage; exhaustive detection') stay in their row. The term is
  itself a governed phrase — an approved formulation, not loose prose. See
  [[language-governance]], [[behavioural-intelligence-overlay]],
  [[five-layer-architecture]].
