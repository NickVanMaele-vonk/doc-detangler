  Nick's refinement. M's 1.2 additionally calls the anonymous quoting
  structure "the single most important market structure characteristic for
  analytical calibration". Re-anchored 2026-07-31 (Nick): the M span cited
  sha256:00f75cd1…, the "Regulatory authority" row of the same 1.1 grid
