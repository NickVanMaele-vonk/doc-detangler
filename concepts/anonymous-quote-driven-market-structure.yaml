notes: >-
  Both S and M define this with differing wording — the candidate list
  marks it "candidate for single glossary definition"; the definition here
  is assembled from S's A.3 "Critical market structure characteristic"
  paragraph and M's 1.1 "Anonymous quote-driven structure" row, pending
  Nick's refinement. M's 1.2 additionally calls the anonymous quoting
  structure "the single most important market structure characteristic for
  analytical calibration". Re-anchored 2026-07-31 (Nick): the M span cited
  sha256:00f75cd1…, the "Regulatory authority" row of the same 1.1 grid
  table, not the "Anonymous quote-driven structure" row this record is
  assembled from — a transcription slip against the intent already stated
  above. Now sha256:d7ac0d41…. Narrowed 2026-07-31 (Nick), ISO 704 §6.5.2:
  the definition proper is the genus-differentia statement alone, assembled
  from S's A.3 wording. Two clauses moved out of it and are kept here as
  the record's prior wording. (1) Illustration — "MTSAM operating as an
  anonymous interdealer electronic order book": a specific venue realising
  the structure, not part of what the structure is; the source spells the
  operator out as "MTS Associated Markets operates as an anonymous
  interdealer electronic order book" in the anchored M 1.1 row and never
  abbreviates it there, which is what raised the definition-token finding.
  The finding clears with the clause. (2) Project consequence — "which
  determines how quote-based manipulation is detected rather than
  preventing its detection": a compression of M's §1.2, block
  sha256:881a98c9…, "It does not prevent detection of quote-based
  manipulation — it determines how that detection is framed, attributed,
  and escalated." That block is not anchored by this record, so the clause
  was drawn from outside its cited provenance — the same defect as the
  MTSAM clause, unflagged only because it contains no domain-shaped token.
  The edge to [[mts-associated-markets]] is dropped with the illustration,
  since edges are extracted from definition text only. Both clauses pass
  the ISO 704 §6.4.4 substitution test as non-definitional: read into M
  1.2's "The anonymous quoting structure of MTSAM is the single most
  important market structure characteristic", clause 1 substitutes and the
  consequence clause does not.
