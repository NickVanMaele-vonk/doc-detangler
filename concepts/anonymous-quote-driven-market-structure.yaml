id: anonymous-quote-driven-market-structure
term: anonymous quote-driven market structure
aliases: [anonymous quoting, anonymous interdealer electronic order book]
status: candidate
superseded_by: null
placement: glossary
used_in: [S, M]
definition: >-
  The market structure in which quote activity is visible to all
  participants but is not immediately attributable — MTSAM operating as an
  anonymous interdealer electronic order book — which determines how
  quote-based manipulation is detected rather than preventing its
  detection.
