id: bilateral-execution-following-anonymous-quote-pressure
term: Bilateral Execution Following Anonymous Quote Pressure
aliases: []
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  Cross-venue manipulation pattern in which the participant applies
  anonymous quote pressure on MTS (bid-side or ask-side aggressive quoting
  creating one-sided depth) causing other participants to adjust their
  bilateral OTC pricing expectations in response to the electronic book
  signal; other participants execute bilaterally at prices that reflect
  the electronic book condition created by the suspected participant's MTS
  activity.
