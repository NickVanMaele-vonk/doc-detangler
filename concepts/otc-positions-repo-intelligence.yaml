notes: >-
  Row 1 of the four removed-category entries in [[removal-register]]; the
  definition is the row's "Description" cell verbatim. MTSAM Limitation
  cell: "MTSAM-L01, MTSAM-L10, MTSAM-L11." — see [[mtsam-l01]],
  [[mtsam-l10]], [[mtsam-l11]]. Removal Rationale and Residual Treatment
  cell, verbatim: "Removed. MTSAM does not receive participant OTC book
  positions on a systematic basis. The OTC bilateral component of the MTS
  feed provides T+1 trade reports only. Building the model around an
  assumption of OTC position visibility would produce a framework that
  cannot be operationalised." The residual in-scope feed is
  [[otc-bilateral-trading]]. This row shares a blank-line block with the
  table header under the convention pipeline, so the hash covers the
  header plus this row.
