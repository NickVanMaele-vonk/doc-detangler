notes: >-
  Single-document term (§3 bulk); defined by the embedded §D.4.1 'BOA
  Archetype to Explanation Type Mapping' amendment text inside the A.6
  archetype table (hash covers the whole table block). Condition-5
  role: 'Explanation types listed as ‘safe’ are accepted as automatic
  validation basis (Condition 5 of the seven auto-validation
  conditions, §VI-A.5.3 UCE v30). This does not mean they are confirmed
  non-manipulative — it means the model has structural grounds to
  accept the explanation without individual review. Any QA sample that
  challenges the explanation triggers recalibration.' The ‘safe’ class
  is a value set, not an alias (C9 hygiene). See
  [[mediumreviewengine]], [[behavioural-objective-assessment]],
  [[suppressor-code]], [[automatic-validation]], [[bvr]],
  [[qa-validation]].
