conflict:
  summary: >-
    Acronym collision inside one table (candidate list §7c, conflict P-5):
    (P) §0.1 defines BC as "Behaviour Category" — the classification unit
    this taxonomy enumerates — and then, three rows later in the same
    glossary, uses BC for "Behavioural-Conditioning impact" as an Outcome
    Score dimension. Two senses of one abbreviation in a document whose
    stated rule is that every abbreviation is spelled out. Nick's ruling
    2026-07-30: keep, flag to humans for disambiguation — surfaced, not
    reconciled (C8 / criterion 6). See [[outcome-score]].
  spans:
    - doc: samples/prototype-BC17.md
      section: "§0.1 Master glossary — every abbreviation spelled out"
      quote: >-
        BC Behaviour Category the classification unit; BC-17 is one of
        seventeen
