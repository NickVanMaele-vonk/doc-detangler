notes: >-
  Single-document term (§3 bulk). Definition verbatim from the §1.1
  Primary dealer obligations row, whose basis is that 'Authorised primary
  dealers hold market making obligations to the ADA including quoting
  obligations in normal and stressed market conditions' and that 'Prior
  FSMA/ESMA findings about liquidity provision conduct feed RRF
  assessment' — see [[primary-dealer]]. The extraction flags a
  near-synonym pair with [[mm-safeharbour]]; kept as separate records
  without shared aliases (QML / SB-13 precedent) — the category is the
  legitimate explanation, the safe-harbour is the seven-criteria test with
  outcome codes. Extraction aliases 'market making obligations' /
  'quoting obligations' not adopted: they name the obligations, not the
  explanation category. ADA, FSMA and ESMA are reference-terms rows
  (criterion 3).
