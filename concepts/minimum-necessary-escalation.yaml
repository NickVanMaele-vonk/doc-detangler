id: minimum-necessary-escalation
term: Minimum Necessary Escalation
aliases: [MNE, MNE principle]
status: candidate
superseded_by: null
placement: UCE
used_in: [U]
definition: >-
  Where two scoring approaches produce equally defensible escalation
  conclusions, the architecture must prefer the one that generates fewer
  analyst queue entries. The architecture is disposal-oriented first,
  escalation-oriented second. Detection must be complete; escalation must
  be selective.
