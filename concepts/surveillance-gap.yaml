notes: >-
  Single-document term (§3 bulk). Orphan: generic surface with a governed
  local meaning, never itself defined (C2). M formalises gaps as objects —
  [[mtsam-l-data-limitation-register]] codes, [[isgo]] findings,
  [[surveillance-gap-flag]] values; the MTSAM-L07 gap has its own §1.3
  section ([[mtsam-l07]]). Pillar 2 characterises the principal instance
  as a variant surface: 'The principal residual detection gap in the MTSAM
  surveillance framework does not relate to absent trade-based scenarios.
  It relates to the need for enhanced visibility over quote-driven
  behavioural dynamics that are inherent to anonymous interdealer
  sovereign bond markets.' Gap language is itself governed:
  [[language-governance]] approves 'Principal residual enhancement area'
  and prohibits 'significant gaps in surveillance' (§0.3 'Describing the
  remaining gap' row). §1.2 operative use: 'MTSAM-L07 surveillance gap
  flag applied. ISGO-02 finding generated.' Extraction aliases (residual
  gap, residual detection gap, structural gap, New Surveillance Gap) are
  variant surfaces for particular gap instances, not adopted as aliases.
