id: external-context-intelligence-layer
term: External Context Intelligence Layer
aliases: [ECIL]
status: candidate
superseded_by: null
placement: glossary
used_in: [U, S, M]
definition: >-
  The layer supplying structured contextual intelligence — event ingestion,
  Event Object Schema, contextual directionality logic, event materiality
  scoring, and scoring integration — for the analytical distinction between
  market-driven and manipulative behaviour, which cannot be resolved from
  alerts alone.
