notes: >-
  Defined in both S and M ("Six-component CMCS weighting") with the same
  formula, but component names differ slightly between the docs
  (candidate-list note) — drift, not conflict, per the S drift note: "The
  original four-component formula (s1–s4) is a subset: the two new
  components explicitly add OLO yield movements and sovereign spread
  movements." Thresholds: CMCS ≥ 0.55 cmcs_confirmed; ≥ 0.70
  cmcs_high_confidence (+0.25 additional CQS, total +1.00); event
  co-occurrence reduces the confirmation threshold from 0.55 to 0.45.
  Six calibration parameters are name-checked here rather than given
  records ([[sd03]] route, Nick's ruling 2026-07-30): FUT_VOLUME_THRESHOLD
  and FUT_OI_THRESHOLD calibrate cmcs_l1_abnormal_futures_activity (third
  span); FUT_INTRADAY_THRESHOLD calibrates cmcs_s2_futures_volume,
  CMCS_BASIS_THRESHOLD cmcs_s4_basis_move, and CMCS_SOV_SPREAD_THRESHOLD
  cmcs_s6_sovereign_spread (first span); CMCS_ALIGNMENT_SESSIONS
  calibrates cmcs_l2_alignment (second span). The extraction's grouping
  label "CMCS calibration parameter set" is not corpus wording.
