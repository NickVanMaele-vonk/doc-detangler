id: cross-market-convergence-score
term: Cross-Market Convergence Score
aliases: [CMCS]
status: candidate
superseded_by: null
placement: glossary
used_in: [S, M]
definition: >-
  A composite score combining six signals within a configurable window
  (reference: a 30-minute intraday window centred on the OLO activity IBE),
  computed as the weighted sum (0.25 × s1) + (0.20 × s2) + (0.15 × s3) +
  (0.15 × s4) + (0.15 × s5) + (0.10 × s6).
