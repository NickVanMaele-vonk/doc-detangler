notes: >-
  Single-document term (§3 bulk). Enforcement mechanism of Core Design
  Principle 1 ('Behaviour precedes suspicion'). The Step 2 gate cell reads
  'GATE: pattern_matc hed=TRUE' (OCR-split token) and its rule reads
  'Behavioural structures identified across Tier 1/2/3 patterns. No
  pattern → signal closed at Level 0.' 'Level 0' here is a
  signal-disposition level, distinct from [[evidence-hierarchy]] Levels
  1–5 (word-overload cluster, candidate-terms-merged.md §4 item 30). 'Tier
  1/2/3 patterns' is deferred pending the 'Tier' overload disposition (§4
  item 29). See [[22-step-analytical-pipeline]].
