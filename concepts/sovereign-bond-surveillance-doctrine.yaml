id: sovereign-bond-surveillance-doctrine
term: Sovereign Bond Surveillance Doctrine
aliases: [sovereign bond market doctrine]
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  Analytical doctrine for quote-driven, liquidity-sensitive, cumulative
  manipulation in sovereign bond markets: manipulation is often subtle,
  liquidity-driven, and cumulative across the trading day. No single
  intraday event is typically decisive. The analytical question is not
  'was this trade suspicious?' but 'did this participant's cumulative
  intraday behaviour combine with their EOD market position to produce
  a material manipulation outcome?'
