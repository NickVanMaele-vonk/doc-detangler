notes: >-
  Row 3 of the four removed-category entries in [[removal-register]]; the
  definition is the row's "Description" cell verbatim. MTSAM Limitation
  cell: "Outside MTS surveillance perimeter." — the only one of the four
  scoped by perimeter rather than by an MTSAM-L code. Removal Rationale and
  Residual Treatment cell, verbatim: "Removed. The Four-Level Observability
  Framework (§A.4.1 Doc 2) correctly positions MTS-only cross-instrument
  intelligence (Level 1) and public market context (Level 2) as the
  operational detection layers. Cross-venue analytical hypotheses (Level 3)
  use only data already in scope." See
  [[four-level-observability-framework]]. The three named venues — EuroMTS,
  Tradeweb, Bloomberg — are externally owned and are reference-terms rows,
  not records (criterion 3; Eurex precedent). Distinct from
  [[cross-venue-manipulation]], which is a behaviour, not a feed.
