id: mts-associated-markets
term: MTS Associated Markets
aliases:
  - MTSAM
  - MTS Associated Markets N.V.
  - MTS Associate Markets N.V.
  - MTS AM
  - the MTSAM market
  - MTS Belgium OLO sovereign bond market
status: candidate
superseded_by: null
placement: glossary
used_in: [U, S, M]
definition: >-
  The Belgian legal entity — MTS Associated Markets N.V., a joint venture
  between MTS and a consortium of banks, supervised by the FSMA and subject
  to the EU Market Abuse Regulation (MAR) — operating the electronic
  interdealer trading venue for Belgian OLO sovereign bonds.
