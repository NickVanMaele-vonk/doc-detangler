review: >-
  Decision: keep — it's a legal entity. Use "Associated" spelling as master
  (Nick, candidate-terms-merged.md §1a)
notes: >-
  Meaning drifts in the sources: MTSAM denotes both the trading venue (the
  market) and the surveilling institution ("MTSAM's surveillance framework",
  "MTSAM considers…"). (A) uses both "Associated" and "Associate" spellings;
  its §0 Definitions entry (second source span, joint-venture/FSMA sentence)
  uses "Associate" — reproduced verbatim there, master spelling per Nick's
  ruling. Distinct from MTS S.p.A. (the platform operator); (A) also embeds
  "MTS AM" meaning MTSAM. The MCL 1.1 span is a grid table; the hash covers
  the whole table block.
