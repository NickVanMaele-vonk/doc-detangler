notes: >-
  Single-document term (§3 bulk). Definition is the v22 changelog entry —
  Section 11 itself is absent from this shortened document; only the
  changelog description and the title-page subtitle 'Section 11 —
  Three-Output Integration — MTSAM Configuration' survive (absence from
  the shortened blueprints is not evidence of absence from the full set,
  §7b caution). Alias 'three-output model' adopted: the changelog names
  the same model; strictly the Integration is the Section 11 framework
  that formalises it — surfaced, not judged. The three outputs are
  [[behaviouralconcern]], [[evidenceconfidence]] and
  [[escalationreadiness]]. The changelog sits inside the v21/v22 version
  inconsistency (title page says Version 21; the changelog is headed 'What
  is new in v22') — a criterion-6 contradiction carried as data.
