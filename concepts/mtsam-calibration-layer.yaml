flags: [A, conflict]
conflict:
  summary: >-
    Four-way naming conflict for the same layer (candidate list §7c,
    conflict P-3): U calls Document 3 an "Institution Calibration Layer", M titles
    itself "MTSAM Institution Calibration Layer", the filename abbreviates
    it MCL, and (P) cites it as the "Market Configuration Layer" — a fourth
    variant that changes the head noun from calibration to configuration.
    Nick's ruling 2026-07-30: keep, flag to humans for disambiguation —
    surfaced, not reconciled (C8 / criterion 6).
  spans:
    - doc: samples/blueprint-UCE-shortened.md
      section: "Front matter"
      quote: >-
        Institutional configuration is provided by Institution Calibration
        Layers (Document 3).
      para_hash: sha256:f0767104d9d9254f299cb80699dd52e53fb9b766645447239465ee0f5c91ec6f
