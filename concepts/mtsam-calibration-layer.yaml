      para_hash: sha256:886231684d547f42c1739a47de702a7e3e0c8e2c5a9bfe6f671f54b0f1a4ffdc
review: "Decision: keep (Nick, candidate-terms-merged.md §1a)"
notes: >-
  Acronym MCL appears only in the filename, never in the document body.
  Nick's gloss (review, not source): a layer of the solution containing any
  company-specific definitions and rules, MTSAM being one company. UCE Part
  XX asserts Calibration Layers may operationalise but never vary universal
  doctrine. MCL's title says v21 but it contains a "what is new in v22"
  block — live contradiction, surfaced not harmonised (criterion 6).
