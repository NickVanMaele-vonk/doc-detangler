notes: >-
  Single-document term (§3 bulk); one of the four named
  [[cross-venue-manipulation]] patterns (grid-table row; the hash covers
  the pattern table block). Detection logic: OTC execution price proximity
  to MTS quote price at the time of conditioning, within
  SD03_REVERSION_WINDOW_SECONDS of the participant's MTS quote withdrawal
  ([[sd03]]'s calibration parameter); 'where the execution price reflects
  the conditioned price level, off-platform price conditioning is
  confirmed as a candidate pattern.'
