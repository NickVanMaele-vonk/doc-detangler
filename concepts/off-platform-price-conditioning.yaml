id: off-platform-price-conditioning
term: Off-Platform Price Conditioning
aliases: []
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  Cross-venue manipulation pattern in which the participant quotes
  aggressively on one side of the MTS order book — not to execute
  electronically but to condition the price expectation of bilateral
  counterparties who can see the electronic book — and executes
  bilaterally at prices close to or better than the electronic book levels
  they just conditioned.
