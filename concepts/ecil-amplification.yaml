definition: >-
  The ECIL amplification value (ibe.ecil_amplification) participates
  directly in Automatic Validation as Condition 3 (§VI-A.5.3 UCE v30);
  the threshold of 0.20 was selected to exclude signals where macro or
  event context has materially amplified the analytical result.
