notes: >-
  Single-document term (§3 bulk). Definition assembled from the §1.0
  intro; the four layers are 'Layer 1 — Core Surveillance (Primary
  analytical inputs)', 'Layer 2 — Context (External market context for
  ECIL enrichment)', 'Layer 3 — Intelligence (Participant and entity
  context)' and 'Layer 4 — AI (Narrative generation and analyst query
  interface)' — layer titles are values of this term, not aliases (C9
  hygiene). The explicit exclusion register documents that 'the model was
  designed around what MTSAM can realistically obtain, not around what a
  theoretically complete surveillance system would require'. Data stack
  governance ties feed additions to [[cco-assessment]] approval and the
  [[calibration-change-register]], and feed changes to the
  [[analytical-perimeter]]. 'Layer' polysemy (four data layers here vs the
  five-layer FSMA architecture) is §4 item 31 — see
  [[five-layer-architecture]]. See [[mts-trades]],
  [[alert-abstraction-layer]].
