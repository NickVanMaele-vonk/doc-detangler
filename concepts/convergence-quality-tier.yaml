id: convergence-quality-tier
term: Convergence Quality Tier
aliases: [CQT, CQT1, CQT2, CQT3, CQT gate]
status: candidate
superseded_by: null
placement: glossary
used_in: [U]
definition: >-
  CQT1 (CQS 3–5) = MEDIUM minimum; CQT2 (CQS 6–8) = HIGH minimum; CQT3
  (CQS ≥9) = VERY HIGH eligible. CQT gate: CQT2 required for HIGH; CQT3
  for VERY HIGH.
