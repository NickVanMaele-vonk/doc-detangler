notes: >-
  Single-document term (§3 bulk). Orphan: a confidence field with levels
  (LOW, MEDIUM) that gates anonymous-market interaction evidence; never
  defined. Step 5b verbatim: 'Anonymous quoting attribution constraint:
  Interaction Domain (C) confirmation based solely on anonymous quote
  observation --- where no post-session order-level attribution is
  available and attribution_confidence is LOW --- may satisfy DIF domain C
  as a contributing domain, but may not independently satisfy DIF as the
  only non-transactional domain where model_confidence is below MEDIUM.'
  and 'Where domain C is the sole non-domain-A contribution and
  attribution_confidence = LOW: DIF is not satisfied; classification is
  retained at MEDIUM-INVESTIGATE pending additional domain evidence (B, D,
  or E) or post-session attribution confirmation.' model_confidence is not
  carried as an alias — one definition site (C9), see [[modelconfidence]].
  'Consistent with CCT=IMPLICIT cap in anonymous markets (Document 3 §1.2;
  Document 2 §D.5.3).' — see [[coordination-classification-tier]]. See
  [[domain-independence-filter]], [[dif-analytical-domains]],
  [[medium-investigate]].
