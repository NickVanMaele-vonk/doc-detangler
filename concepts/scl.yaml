id: scl
term: SCL
aliases: [supervisory confidence tier, SCL tier]
status: candidate
superseded_by: null
placement: glossary
used_in: [U, M]
definition: >-
  The supervisory confidence tier attached to an escalation:
  SCL-COMPELLING — the convergent evidence across [n] dimensions constitutes
  a strong basis for reasonable grounds; SCL-PRECAUTIONARY — reasonable
  grounds exist notwithstanding specific gaps.
