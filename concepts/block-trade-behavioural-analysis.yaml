notes: >-
  Single-document term (§3 bulk). Definition is the Layer 3 role
  formulation ('Risk-based enhancement'); status 'Partially operational.
  PowerQuery-based categorisation logic applied to alert population.'
  Pillar 4 grounds it — 'MTSAM has already initiated behavioural
  categorisation methodologies focusing on high-risk block trade and
  liquidity-event scenarios using behavioural and contextual indicators.'
  — under the heading 'Block Trade Behavioural Analysis Closes an
  Important Structural Gap', and notes 'The combination of RT08 (liquidity
  stress) with behavioural context (dominance, repetition, cross-alert) is
  already operationalised.' Alias 'block trade behavioural intelligence'
  is the Core Regulatory Position's surface for the same capability (sb-12
  precedent); 'Layer 3' is a position, not an alias (C9 hygiene). See
  [[five-layer-architecture]], [[core-regulatory-position]], [[rt08]].
