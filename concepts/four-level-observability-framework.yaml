id: four-level-observability-framework
term: Four-Level Observability Framework
aliases: []
status: candidate
superseded_by: null
placement: glossary
used_in: [S, M]
definition: >-
  The framework assigning each cross-instrument or cross-venue analytical
  finding to one of four observability levels — answering "what can we
  reliably observe, and what is the correct epistemological status of each
  observation?" — with the ISGO language required to reflect which level
  applies to each finding.
