notes: >-
  Single-document term (§3 bulk). Core Design Principle 12, added in v24;
  the 'New in Version 25' note formalises it as a first-class
  architectural control, consistent with the elevation of the Behavioural
  Concern Framework to Part VI-A. The OCR split 'MEDIUM- STRUCTURED
  REVIEW' is reproduced verbatim (criterion 5) — see
  [[medium-structured-review]]. Consequence clause excluded from the
  definition and preserved verbatim: 'FAIL without documented root-cause
  analysis is a governance failure equivalent to a classification without
  explanation_trace.' qa_validation_result is an output field in the
  Output Schema (§XIII.2), not an alias — see [[holistic-output-schema]];
  the validation corpus is the [[behavioural-scenario-library]].
