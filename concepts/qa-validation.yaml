id: qa-validation
term: QA Validation
aliases: [Core Design Principle 12]
status: candidate
superseded_by: null
placement: UCE
used_in: [U]
definition: >-
  Every qualified signal at MEDIUM- STRUCTURED REVIEW or above must be
  validated against the Behavioural Scenario Library. Consistency between
  the engine's assessment and previously validated behavioural patterns is
  a required analytical output — not an optional quality check. An
  unvalidated signal is an analytically incomplete signal. QA Validation
  (§XV.5.4): PASS / PASS WITH VARIANCE / FAIL result recorded per signal.
