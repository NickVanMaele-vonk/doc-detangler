id: domain-independence-filter
term: Domain Independence Filter
aliases: [DIF, domain diversity check]
status: candidate
superseded_by: null
placement: UCE
used_in: [U]
definition: >-
  The Domain Independence Filter (DIF) requires cross-domain evidence
  before HIGH classification, reducing single-domain HIGH inflation; at
  Step 5b it verifies that CQS is built from contributions in ≥2
  independent analytical domains. Single-domain CQT2 (all CQS
  contributions from domain A only) → HIGH blocked, retained at MEDIUM-
  INVESTIGATE for structured review. Exception: Collusion Override Path
  bypasses DIF.
