# Branch policy for the MTSAM-docs default branch. Four independent gates,
# one job each, so a red run names which one failed and each can be marked
# required separately (Build Validation policies, one per job, or one policy
# on the whole pipeline — prefer per-job if the project allows it).
#
# This pipeline assumes the detangle project lives at <repo>/detangler — every
# step sets workingDirectory accordingly. `find_root()` walks up, never down,
# so a command run from the repo root would exit 2; and `ruff check .` from
# the root would lint the whole monorepo.
#
# Exit codes are the contract (ADR-001 Decision 2, README "Exit codes"):
# 0 clean, 1 findings a human must disposition, 2 no verdict reached. A step
# fails on both 1 and 2 — the distinction is for the reader of the log, not
# for the runner — so nothing needs special handling here.
#
# NOTE on PR builds: for a repo hosted in Azure Repos, the `pr:` YAML keyword
# is ignored — PR validation is configured as a Build Validation branch
# policy on the default branch, pointing at this pipeline with a path filter
# of /detangler/*. The `trigger:` below covers post-merge runs on the default
# branch. Confirm the default branch name in MTSAM-docs before first use.

# A force-push supersedes the run it replaced; nothing here is worth
# finishing. Azure has no cancel-in-progress concurrency group; `batch: true`
# at least collapses queued runs of the same branch into one.
trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - detangler

variables:
  # The floor declared in pyproject. Local development runs 3.12, so the two
  # ends of the supported range are covered between here and the workbench.
  pythonVersion: "3.11"
  # `para_hash` is *defined* as a hash of pandoc's plain-text rendering, so
  # pandoc's version is part of the provenance contract. Pinned from GitHub's
  # release CDN, not apt (backlog B-3's CI half, Nick 2026-08-05): Ubuntu
  # mirror stalls hung this step twice on the GitHub repo (PR #93, PR #102),
  # and upstream 3.1.3 was verified to render all 359 records to the same
  # hashes as the Debian 3.1.3+ds-2 the fixtures were computed under.
  # Bumping this version is a provenance event, not an upgrade: see B-3.
  pandocVersion: "3.1.3"
  pandocDeb: "https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb"

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: tests
    displayName: tests and lint
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(pythonVersion)
      # The test fixtures build a real git repo and shell out to real pandoc,
      # because stubbing either would test the stub (tests/conftest.py).
      - script: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/pandoc.deb "$(pandocDeb)"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
          pandoc --version | head -1 | grep -qF "$(pandocVersion)"
        displayName: Install pandoc (pinned)
        timeoutInMinutes: 5
      - script: pip install -e ".[dev]"
        workingDirectory: detangler
        displayName: pip install
      - script: ruff check .
        workingDirectory: detangler
        displayName: ruff check
      # Run the tests even when lint fails: a style complaint should not hide
      # a broken assertion.
      - script: python -m pytest
        workingDirectory: detangler
        displayName: pytest
        condition: succeededOrFailed()

  - job: records
    displayName: detangle validate
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(pythonVersion)
      # Same pin, same reasoning as the tests job — and the version is echoed
      # because a provenance failure that appears out of nowhere is almost
      # certainly this.
      - script: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/pandoc.deb "$(pandocDeb)"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
          pandoc --version | head -1 | grep -qF "$(pandocVersion)"
        displayName: Install pandoc (pinned)
        timeoutInMinutes: 5
      - script: pip install -e .
        workingDirectory: detangler
        displayName: pip install
      # Do the canonical records still tell the truth about `samples/`? Spans,
      # blob ids, verbatim definition runs, conflict quotes, links, edge
      # targets, one definition site.
      - script: detangle validate --json
        workingDirectory: detangler
        displayName: detangle validate

  - job: graph
    displayName: detangle graph --check
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(pythonVersion)
      # No pandoc: this gate reads YAML and never touches the corpus.
      - script: pip install -e .
        workingDirectory: detangler
        displayName: pip install
      # Does the derived file still match the canonical one? Regenerate in
      # memory and compare bytes — this is what makes "never hand-edit a
      # generated artifact" (ADR-001 Decision 5) enforceable rather than
      # aspirational.
      - script: detangle graph --check --json
        workingDirectory: detangler
        displayName: detangle graph --check

  - job: lift
    displayName: detangle lift --check
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(pythonVersion)
      # The lift anchors authored wording by `para_hash`, which is defined as
      # a hash of pandoc's plain-text rendering — same pin, same reasoning as
      # the validate job above (backlog B-3).
      - script: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/pandoc.deb "$(pandocDeb)"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
          pandoc --version | head -1 | grep -qF "$(pandocVersion)"
        displayName: Install pandoc (pinned)
        timeoutInMinutes: 5
      - script: pip install -e .
        workingDirectory: detangler
        displayName: pip install
      # The fourth gate (step 3.5 note (a), built 2026-08-08): glossary.md is
      # canonical for definition prose and each record carries a derived copy,
      # so an edit to the file without `detangle lift` in the same PR — or a
      # heading/alias line contradicting its record — fails here.
      - script: detangle lift --check --json
        workingDirectory: detangler
        displayName: detangle lift --check
