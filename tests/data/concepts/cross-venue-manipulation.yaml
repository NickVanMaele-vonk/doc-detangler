notes: >-
  Single-document term (§3 bulk). Definition is the A.4 'core cross-venue
  manipulation logic' paragraph, which continues: 'The electronic venue
  sees the conditioning behaviour without the execution; the OTC bilateral
  reporting sees the execution without the conditioning. Neither view
  alone is sufficient for detection.' Second span: the A.4.2 principle row
  assesses cross-venue behavioural inconsistency 'as an independent
  behavioural indicator contributing to the convergence score, not merely
  as a data reconciliation problem'; where divergence is confirmed,
  cross_venue_divergence_confirmed=TRUE feeds the
  [[repetition-indicator]] and the Dependency Filter assessment
  ([[dependency-score]]). The extraction's alias 'cross-venue
  fragmentation detection' is not adopted: the corpus phrase 'cross-venue
  fragmentation' appears only in the MTSAM-L03 participant-identity
  limitation row. The four named patterns are [[liquidity-migration]],
  [[off-platform-price-conditioning]],
  [[bilateral-execution-following-anonymous-quote-pressure]] and
  [[venue-arbitrage]].
