id: cross-venue-manipulation
term: cross-venue manipulation
aliases: [cross-venue behavioural inconsistency, cross-venue divergence]
status: candidate
superseded_by: null
placement: SBSP
used_in: [S]
definition: >-
  A participant conditions the anonymous electronic order book through
  quote behaviour (creating price expectations, removing depth, signalling
  directionality) and then executes the profitable side of the strategy
  bilaterally in the OTC market — outside the electronic venue's detection
  perimeter.
