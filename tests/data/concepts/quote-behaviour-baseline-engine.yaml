notes: >-
  The candidate list marks the definition "M (functional), (P)": the
  definition here is drafted from M's functional description
  ("Participant-specific baseline comparison (QBBE/POFP): comparison of
  current behaviour against each participant's own historical profile —
  not against a population threshold") and remains subject to Nick's
  "define later". The letter-expansion comes from (P) §0.1 ("participant
  quote baselines"). S usage: "QBBE baseline" / "QBBE quote baseline
  engine" in grid tables. Baseline-pair distinction to keep clear: QBBE is
  quote-side; POFP is order-flow-side — see
  [[participant-order-flow-profile]].
