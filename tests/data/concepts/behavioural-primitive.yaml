conflict:
  summary: >-
    Two unrelated "primitive" vocabularies (candidate list §7c, conflict
    P-10): this term's named instances are behaviour tokens
    (QUOTE_WITHDRAWAL, SPREAD_WIDENING, …), whereas (P) calls the nine
    RT/RD alert codes "alert primitives". M's API-stack row sits between
    the two senses, mapping the nine alerts onto "UCE behavioural
    primitives" and "Domain 3 primitive codes" — which is what makes the
    bare alias "primitive" ambiguous. Nick's ruling 2026-07-30: keep, flag
    to humans for disambiguation; do not conflate. Surfaced, not
    reconciled (C8 / criterion 6). See [[generic-alert-primitives]].
  spans:
