        Alert Abstraction Layer (Section 3.2): translates MTS alert names to
        UCE behavioural primitives. All nine alerts mapped to Domain 3
        primitive codes.
      para_hash: sha256:520ec07b75b6c08bbb4a3103e5509ec05081cb671ac1c778f9e7e5c46dc07310
    - doc: samples/prototype-BC17.md
      section: "§1.2 `RawMTSAlert` — one surveillance alert (MTS S.p.A. surveillance export)"
      quote: >-
        The nine implemented alert primitives and their mapping (from
        alert_map.py), with abbreviations spelled out:
      para_hash: sha256:b67b0047741baf94c257c74dba3f5e29e6bf35de8df205ae03a9cc8bdb6e0c26
review: "Decision: keep (Nick, candidate-terms-merged.md §1b)"
notes: >-
  Set-level orphan (definition: null — not invented, C2). Both sources
  attribute the construct to the UCE ("the Universal Core Engine's
  behavioural primitives", "translates MTS alert names to UCE behavioural
  primitives" via the Alert Abstraction Layer, "Domain 3 primitive codes"),
  yet the candidate list counts U as related only ("U rel."), not as usage.
  Named instances per the candidate list: QUOTE_WITHDRAWAL, SPREAD_WIDENING,
  LIQUIDITY_REMOVAL, BLOCK_TRADE, AGGRESSIVE_BUY/SELL, SUSPENSION.
