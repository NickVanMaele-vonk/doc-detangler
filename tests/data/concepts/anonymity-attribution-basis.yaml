definition: >-
  The mandatory explanation_trace field recording the attribution basis for
  quote-domain interaction signals, with three enumerated values:
  'order_id_post_session' (confirmed), 'market_pattern_probabilistic'
  (unconfirmed), 'trade_execution_confirmed'.
