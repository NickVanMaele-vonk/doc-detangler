notes: >-
  Single-document term (§3 bulk). Not an implemented alert: the §0.1 RT08
  row notes 'Primary detection pathway for pre-stress manipulation given
  RT22 is not yet implemented' — see [[rt08]]. Definition assembled from
  the §0.2 Layer 4 naming appositive; that row continues 'This layer is
  the only pathway to its full detection — RT08 provides compensating
  coverage, not equivalent replacement' and is 'Addressable through
  MTSAM-L07 remediation' ([[mtsam-l07]], [[five-layer-architecture]]). The
  §0.3 row fixes the approved framing: 'RT08 provides compensating
  coverage for the absent RT22 alert' and 'RT08 detects stress events — it
  does not detect the anticipatory withdrawal that causes them' — see
  [[language-governance]]. Placement MCL: the surface occurs in M only
  (7 occurrences; 0 in U, 0 in S, and 0 in (P) — unlike RT02 and RT05,
  this code has no prototype presence at all, so the (P)-promotion
  rationale of the earlier RT*/RD* re-placement ruling never applied to
  it). Nick ruled 2026-07-30, on the placement findings of the first
  `detangle validate` run, that the standard rule governs on the corpus
  we have. Expected to be revisited against the full documents, where a
  second component blueprint may well use it.
