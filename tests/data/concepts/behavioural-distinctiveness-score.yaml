id: behavioural-distinctiveness-score
term: Behavioural Distinctiveness Score
aliases: [BDRS, BDRS_THRESHOLD, BPL_distinctiveness_score]
status: candidate
superseded_by: null
placement: UCE
used_in: [U]
definition: >-
  BDRS measures whether the participant's behaviour is materially
  different from peer participants in the same session. BDRS =
  max(MWBR_metric, BPL_distinctiveness_score). BDRS ≥ BDRS_THRESHOLD
  (reference: 1.0σ above peer on at least one primary dimension) required
  for HIGH classification that is not already eligible for AUTO_CLOSE or
  BATCH.
