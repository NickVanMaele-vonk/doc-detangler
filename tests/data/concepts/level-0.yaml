notes: >-
  Minted under Nick's 2026-07-30 word-overload ruling
  (candidate-terms-merged.md §4 item 30) to give the signal-disposition
  sense of "Level" its own definition site. Orphan (definition: null —
  not invented, C2): both spans use it, neither defines it. U states the
  disposition twice in identical wording — "No pattern → signal closed at
  Level 0" — once as the enforcement mechanism of Core Design Principle 1
  ("Behaviour precedes suspicion", I.2) and once as the Step 2 gate rule
  (II.1). The numeral is what disambiguates it: no other "Level" scale in
  the corpus has a zero. Distinct from [[evidence-hierarchy]] Levels 1-5,
  [[four-level-observability-framework]] Levels 1-4,
  [[cross-instrument-context-intelligence]] Levels 1-3, [[bci-levels]],
  [[l5-audit-record]], and the maturity levels of
  [[six-level-progressive-deployment-model]]. Whether Level 0 is a
  terminal closure state or the bottom of a wider disposition scale is
  not stated anywhere in the shortened corpus — surfaced, not resolved
  (criterion 6). See [[pattern-gate]].
