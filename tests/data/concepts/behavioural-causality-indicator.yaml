notes: >-
  Single-document term (§3 bulk). v29 row, §VI-A.3.7.1 (Amendment
  UCE-AMD-BVR-001). Consequence/gate statements excluded from the
  definition and preserved verbatim: 'Follower Rule: BCI < 3 →
  BehaviouralConcern capped at MEDIUM (hard cap, not overridable). HIGH
  gate: BCI ≥ 3 required. VERY HIGH gate: BCI ≥ 7 required in general
  case. PRIMARY_DRIVER code: BCI ≥ 10 → bci_concern_driver_code =
  BCI_PRIMARY_DRIVER.' Under the MTSAM-L08 data limitation (HQLD
  unavailable) the maximum achievable BCI is D3 + D4 = 6. The §XIII.2a
  output fields (bci_score, bci_level, bci_data_limitation, …) are not
  carried as aliases — see [[holistic-output-schema]]. See
  [[bci-dimensions-d1-d4]], [[bci-levels]], [[follower-rule]],
