notes: >-
  Single-document term (§3 bulk). D3 and D4 are never named or expanded in
  the shortened corpus — only D1 (Quote Leadership) and D2 (Liquidity
  Leadership) are named. In all MTSAM sessions until HQLD is obtained
  ([[historical-quote-lifecycle-dataset]]): D1 = 0 (bci_d1_available =
  FALSE), D2 = 0 (bci_d2_available = FALSE), bci_data_limitation = TRUE,
  and maximum achievable BCI = D3 + D4 = 6 (Amplifier level maximum). See
  [[behavioural-causality-indicator]].
