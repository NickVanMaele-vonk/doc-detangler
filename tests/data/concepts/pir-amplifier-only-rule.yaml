id: pir-amplifier-only-rule
term: PIR Amplifier-Only Rule
aliases: [PIR Amplifier Rule, PIR amplifier-only rule]
status: candidate
superseded_by: null
placement: UCE
used_in: [U]
definition: >-
  Participant History (PIR) cannot sole-drive a MEDIUM or HIGH preliminary
  RSA assessment. The PIR amplifier-only rule (Doc 3 v22 §11.4) is
  implemented as a capping gate in RSAEngine._assess(): where ALL
  suspicion factors OTHER THAN participant_history are ABSENT, WEAK,
  UNCONFIRMED, or POSSIBLE AND participant_history is STRONG or PRESENT,
  the preliminary assessment is capped at LOW regardless of raw net score.
