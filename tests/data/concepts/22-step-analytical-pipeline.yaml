definition: >-
  Stage 1 of the analytical pipeline: twenty-two sequential steps,
  organised across three phases: structural qualification (Steps 1–11),
  causal and outcome validation (Steps 12–18), and explanatory
  adjudication (Steps 19–22). The pipeline receives IBEs, not individual
  alerts.
