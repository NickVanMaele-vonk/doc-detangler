notes: >-
  Single-document term (§3 bulk). The block titles the statement
  'Regulatory positioning doctrine — architectural separation principle',
  so the doctrine label is adopted as an alias (sb-12 precedent — two
  surfaces, one statement). The doctrine closes with the maxim 'The
  analytical framework is universal; the supervisory narrative is
  institutional.' The unchanged analytical logic is enumerated as
  'convergence gates, evidence hierarchy, CCL causal requirements,
  EscalationReadiness conditions, derisking standards, AI governance
  prohibitions' — see [[convergence-gate]], [[evidence-hierarchy]],
  [[causality-confidence-layer]], [[escalationreadiness]],
  [[derisking-standards]], [[ai-governance-prohibitions]]. A different NCA
  would 'produce a different Section 0 in their own Calibration Layer' —
  see [[mtsam-calibration-layer]].
