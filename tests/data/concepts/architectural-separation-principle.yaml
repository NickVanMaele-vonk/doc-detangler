definition: >-
  Regulatory positioning doctrine: the FSMA regulatory narrative contained
  in this section is institution-specific. It reflects MTSAM's particular
  market structure, implemented alert population, enhancement roadmap, and
  supervisory relationship with FSMA Belgium. It does not modify,
  supplement, or reinterpret the Universal Core Engine analytical
  architecture (Document 1).
