notes: >-
  Single-document term (§3 bulk). Definition assembled from the §0.3
  heading and table introduction. A named governance process, not style
  guidance: a certainty formulation in a PRECAUTIONARY STOR is a 'language
  governance failure' (SCL-tier row), and non-filing language 'must be as
  specific as filing language'. 'approved formulations' and 'prohibited
  formulations' are the table's column names — values, not aliases (C9
  hygiene). Closing block: FSMA evaluates the surveillance posture on five
  dimensions 'more important than alert count', which the five-pillar
  position and this governance are designed to answer. See [[scl]],
  [[closed-justified]], [[five-pillar-fsma-argument]], [[mm-safeharbour]],
  [[cco]].
