definition: >-
  The market-maker safe-harbour test with documented outcome codes
  (CONFIRMED / PARTIAL / FAILED); MM_SAFEHARBOUR_CONFIRMED removes the
  mandatory CCO escalation pathway as a structural scoring effect, not only
  an explanatory label.
