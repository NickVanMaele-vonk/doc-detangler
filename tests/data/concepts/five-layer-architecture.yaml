notes: >-
  Single-document term (§3 bulk). Definition from the §0.2 table
  introduction; each layer's role is a row of that table. The five layers
  are values, not aliases (C9 hygiene): Layer 1 (existing RT/RD
  surveillance scenarios — [[primary-signal-generation-layer]]), Layer 2
  (behavioural adjudication — [[behavioural-intelligence-overlay]]), Layer
  3 ([[block-trade-behavioural-analysis]]), Layer 4 (quote intelligence
  surveillance — [[quote-intelligence-architecture]]), Layer 5 (contextual
  enrichment and [[replayable-audit]]). The Layer 4 title carries the
  emphasis 'THE SINGLE MOST IMPORTANT STRATEGIC ENHANCEMENT DEPENDENCY' —
  casing reproduced (criterion 5). Not to be confused with the four data
  layers of the §1.0 MTSAM API Stack — two different layer taxonomies in
  the same document (extraction caution; cf. the three-way Tier overload
  surfaced on the S side).
