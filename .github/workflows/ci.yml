# Branch policy for `main`. Four independent gates, one job each, so a red
# run names which one failed and each can be marked required separately.
#
# Exit codes are the contract (ADR-001 Decision 2, README "Exit codes"):
# 0 clean, 1 findings a human must disposition, 2 no verdict reached. A step
# fails on both 1 and 2 — the distinction is for the reader of the log, not
# for the runner — so nothing needs special handling here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A force-push supersedes the run it replaced; nothing here is worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The floor declared in pyproject. Local development runs 3.12, so the two
  # ends of the supported range are covered between here and the workbench.
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    name: tests and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The test fixtures build a real git repo and shell out to real pandoc,
      # because stubbing either would test the stub (tests/conftest.py).
      - name: Install pandoc
        # Pinned from GitHub's release CDN, not apt (backlog B-3's CI half,
        # Nick 2026-08-05): Ubuntu mirror stalls hung this step on PR #93 and
        # again on PR #102. The pin was verified before switching, as B-3
        # demands: upstream 3.1.3 renders all 359 records to the same hashes
        # as the Debian 3.1.3+ds-2 the fixtures were computed under —
        # `detangle validate` runs clean under both. Bumping this version is
        # a provenance event, not an upgrade: see B-3 before touching it.
        uses: r-lib/actions/setup-pandoc@v2
        timeout-minutes: 5
        with:
          pandoc-version: "3.1.3"
      - run: pandoc --version | head -1
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest
        # Run the tests even when lint fails: a style complaint should not hide
        # a broken assertion.
        if: ${{ !cancelled() }}

  records:
    name: detangle validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # `para_hash` is *defined* as a hash of pandoc's plain-text rendering, so
      # pandoc is a hard dependency here and its version is part of the
      # contract. The version is echoed because a provenance failure that
      # appears out of nowhere is almost certainly this.
      - name: Install pandoc
        # Pinned from GitHub's release CDN, not apt (backlog B-3's CI half,
        # Nick 2026-08-05): Ubuntu mirror stalls hung this step on PR #93 and
        # again on PR #102. The pin was verified before switching, as B-3
        # demands: upstream 3.1.3 renders all 359 records to the same hashes
        # as the Debian 3.1.3+ds-2 the fixtures were computed under —
        # `detangle validate` runs clean under both. Bumping this version is
        # a provenance event, not an upgrade: see B-3 before touching it.
        uses: r-lib/actions/setup-pandoc@v2
        timeout-minutes: 5
        with:
          pandoc-version: "3.1.3"
      - run: pandoc --version | head -1
      - run: pip install -e .
      # Do the canonical records still tell the truth about `samples/`? Spans,
      # blob ids, verbatim definition runs, conflict quotes, links, edge
      # targets, one definition site.
      - run: detangle validate --json

  graph:
    name: detangle graph --check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # No pandoc: this gate reads YAML and never touches the corpus.
      - run: pip install -e .
      # Does the derived file still match the canonical one? Regenerate in
      # memory and compare bytes — this is what makes "never hand-edit a
      # generated artifact" (ADR-001 Decision 5) enforceable rather than
      # aspirational.
      - run: detangle graph --check --json

  lift:
    name: detangle lift --check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The lift anchors authored wording by `para_hash`, which is defined as
      # a hash of pandoc's plain-text rendering — same pin, same reasoning as
      # the validate job above (backlog B-3).
      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2
        timeout-minutes: 5
        with:
          pandoc-version: "3.1.3"
      - run: pandoc --version | head -1
      - run: pip install -e .
      # The fourth gate (step 3.5 note (a), built 2026-08-08): glossary.md is
      # canonical for definition prose and each record carries a derived copy,
      # so an edit to the file without `detangle lift` in the same PR — or a
      # heading/alias line contradicting its record — fails here.
      - run: detangle lift --check --json
